server.port=${PORT:8080}


spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shastra_db}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never


ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
ai.model=${GEMINI_MODEL:gemini-3.8-flash}
